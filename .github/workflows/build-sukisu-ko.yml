name: Build SuKiSU Samsung kernel module + ksud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
      options: --privileged

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build kernelsu.ko
      run: |
        cd SukiSU-Ultra/kernel
        CONFIG_KSU=m \
        CONFIG_KSU_SAMSUNG_DEFEX=y \
        CONFIG_KSU_SAMSUNG_KDP=y \
        CONFIG_KSU_SAMSUNG_RKP=y \
        CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
        CC=clang make

    - name: Copy ko to ksud assets
      run: |
        cp SukiSU-Ultra/kernel/kernelsu.ko SukiSU-Ultra/userspace/ksud/bin/aarch64/

    - name: Install Rust
      run: |
        apt-get update && apt-get install -y curl
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        source $HOME/.cargo/env

    - name: Build ksud
      run: |
        source $HOME/.cargo/env
        cd SukiSU-Ultra/userspace/ksud
        cargo build --release

    - name: Package
      run: |
        mkdir -p /github/workspace/out
        cp SukiSU-Ultra/userspace/ksud/target/release/ksud /github/workspace/out/ksud-samsung-15-6.6
        cp SukiSU-Ultra/kernel/kernelsu.ko /github/workspace/out/android15-6.6_kernelsu-sukisu.ko

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: sukisu-samsung
        path: |
          /github/workspace/out/ksud-samsung-15-6.6
          /github/workspace/out/android15-6.6_kernelsu-sukisu.ko
