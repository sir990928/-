name: 构建 S9380ZHU1AYA1 注入APP

on:
  push:
    branches: [main]
    paths:
      - "Root-My-Galaxy-Payloads/**"
      - "Root-My-Galaxy/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: pa3q-S9380ZHU1AYA1
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译工具
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 编译漏洞载荷与守护进程
        shell: bash
        run: |
          make -C Root-My-Galaxy-Payloads \
            TARGET="${TARGET}" API=35 VARIANT=app clean all
          ls -l "Root-My-Galaxy-Payloads/build/${TARGET}/"
          sha256sum \
            "Root-My-Galaxy-Payloads/build/${TARGET}/cve-2026-43499-app.so" \
            "Root-My-Galaxy-Payloads/build/${TARGET}/cve-2026-43499-root"

      - name: 整理产物目录
        shell: bash
        run: |
          payload="Root-My-Galaxy-Payloads/build/${TARGET}/cve-2026-43499-app.so"
          payload_dst="Root-My-Galaxy-Payloads/artifacts/${TARGET}/cve-2026-43499-app.so"
          helper="Root-My-Galaxy-Payloads/build/${TARGET}/cve-2026-43499-root"
          helper_dst="Root-My-Galaxy/app/src/main/jniLibs/arm64-v8a/libcve43499root.so"
          mkdir -p "$(dirname "$payload_dst")" "$(dirname "$helper_dst")"
          cp -f "$payload" "$payload_dst"
          cp -f "$helper" "$helper_dst"
          payload_size="$(stat -c '%s' "$payload_dst")"
          tmp_manifest="$(mktemp)"
          jq --arg profile "$TARGET" --argjson size "$payload_size" \
            '(.targets[] | select(.profileId == $profile) | .exploit.size) = $size' \
            Root-My-Galaxy-Payloads/support/targets-v2.json > "$tmp_manifest"
          mv "$tmp_manifest" Root-My-Galaxy-Payloads/support/targets-v2.json
          git diff --stat

      - name: 编译正式发布版APK
        working-directory: Root-My-Galaxy
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传APK与运行库产物
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-${{ env.TARGET }}
          retention-days: 30
          if-no-files-found: error
          path: |
            Root-My-Galaxy/app/build/outputs/apk/release/*.apk
            Root-My-Galaxy-Payloads/artifacts/${{ env.TARGET }}/cve-2026-43499-app.so
            Root-My-Galaxy/app/src/main/jniLibs/arm64-v8a/libcve43499root.so
            Root-My-Galaxy-Payloads/support/targets-v2.json

      - name: 提交更新后的载荷文件
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Root-My-Galaxy-Payloads/artifacts/${TARGET}/cve-2026-43499-app.so" \
            "Root-My-Galaxy/app/src/main/jniLibs/arm64-v8a/libcve43499root.so" \
            Root-My-Galaxy-Payloads/support/targets-v2.json
          if git diff --cached --quiet; then
            echo "载荷文件无改动，跳过提交"
          else
            git commit -m "ci: 更新 ${TARGET} 运行时文件 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi