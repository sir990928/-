name: Build Root-My-Galaxy APK

on:
  push:
    branches: [ main ]
    # 关键：仅下面这些目录/文件改动才触发构建
    paths:
      - "Root-My-Galaxy-main/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Root-My-Galaxy-main

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 查看顶层目录
        run: ls -la
        working-directory: .

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Release 正式 APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 打包 APK 为压缩包
        run: |
          mkdir -p ./release_out
          cp app/build/outputs/apk/release/*.apk ./release_out/
          zip -j Root-My-Galaxy-Release.zip ./release_out/*.apk

      - name: 上传压缩后的 Release 包
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-Release-Zip
          path: Root-My-Galaxy-main/Root-My-Galaxy-Release.zip
          retention-days: 7

