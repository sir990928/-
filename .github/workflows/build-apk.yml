name: 构建 S9380ZHU1AYA1 注入APP

on:
  push:
    branches: [main]
    paths:
      - "Root-My-Galaxy-Payloads/**"
      - "Root-My-Galaxy/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: pa3q-S9380ZHU1AYA1
  API: "35"
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.12904245
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 安装基础工具
        run: sudo apt update && sudo apt install -y make zip unzip wget

      - name: 清理预装安卓SDK
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 下载并安装 NDK r29
        run: |
          set -eu
          echo "下载 NDK r29..."
          wget -q --show-progress --timeout=60 --tries=5 \
            "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" \
            -O /tmp/android-ndk.zip
          
          echo "解压 NDK..."
          unzip -q /tmp/android-ndk.zip -d /tmp/
          
          mkdir -p "${ANDROID_SDK_ROOT}/ndk"
          mv /tmp/android-ndk-r29 "${ANDROID_NDK_HOME}"
          rm /tmp/android-ndk.zip
          
          echo "NDK r29 安装完成"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: 验证 NDK
        run: |
          CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API}-clang"
          test -x "$CLANG"
          "$CLANG" --version

      - name: 编译漏洞载荷与守护进程
        run: |
          make -C Root-My-Galaxy-Payloads \
            TARGET="${TARGET}" API="${API}" VARIANT=app clean all
          ls -l "Root-My-Galaxy-Payloads/build/${TARGET}/"

      - name: 更新仓库文件
        run: |
          mkdir -p Root-My-Galaxy-Payloads/artifacts/${TARGET}/
          mkdir -p Root-My-Galaxy/app/src/main/jniLibs/arm64-v8a/
          cp "Root-My-Galaxy-Payloads/build/${TARGET}/cve-2026-43499-app.so" \
             "Root-My-Galaxy-Payloads/artifacts/${TARGET}/cve-2026-43499-app.so"
          cp "Root-My-Galaxy-Payloads/build/${TARGET}/cve-2026-43499-root" \
             "Root-My-Galaxy/app/src/main/jniLibs/arm64-v8a/libcve43499root.so"
          payload_size="$(stat -c '%s' "Root-My-Galaxy-Payloads/artifacts/${TARGET}/cve-2026-43499-app.so")"
          tmp_manifest="$(mktemp)"
          jq --arg profile "$TARGET" --argjson size "$payload_size" \
            '(.targets[] | select(.profileId == $profile) | .exploit.size) = $size' \
            Root-My-Galaxy-Payloads/support/targets-v2.json > "$tmp_manifest"
          mv "$tmp_manifest" Root-My-Galaxy-Payloads/support/targets-v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            "Root-My-Galaxy-Payloads/artifacts/${TARGET}/cve-2026-43499-app.so" \
            "Root-My-Galaxy/app/src/main/jniLibs/arm64-v8a/libcve43499root.so" \
            Root-My-Galaxy-Payloads/support/targets-v2.json
          if git diff --cached --quiet; then
            echo "文件无改动，跳过提交"
          else
            git commit -m "ci: 更新 ${TARGET} 运行时文件 [skip ci]"
            git pull --rebase origin main
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 编译正式发布版APK
        working-directory: Root-My-Galaxy
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 打包产物
        run: |
          mkdir -p out
          cp -r "Root-My-Galaxy-Payloads/build/${TARGET}" out/so-build
          cp Root-My-Galaxy/app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          sha256sum out/so-build/* out/*.apk 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-${{ env.TARGET }}
          retention-days: 30
          if-no-files-found: error
          path: out/**