name: Build Root-My-Galaxy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 统一设置默认工作目录
    defaults:
      run:
        working-directory: ./Root-My-Galaxy-main

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 查看顶层目录
        run: ls -la
        working-directory: .

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传编译后的 APK
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-Debug-APK
          path: 应用程序/build/outputs/apk/debug/*.apk
          retention-days: 7

