name: Build Root-My-Galaxy APK

# 触发条件：推送main分支、手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置JDK 17（Android Gradle必备）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译Debug APK（无需签名，快速测试）
        run: ./gradlew assembleDebug --no-daemon

      # 如果需要正式Release包（需要签名，额外配置密钥）
      # run: ./gradlew assembleRelease --no-daemon

      - name: 上传编译产物APK
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-Debug-APK
          path: 应用程序/build/outputs/apk/debug/*.apk

