name: 云同步到仓库

on:
  workflow_dispatch: # 手动触发：在 Actions 页面点 "Run workflow" 即可开始

jobs:
  sync_data:
    runs-on: ubuntu-latest
    # 增加权限，允许 Action 写入你的仓库
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 从云端下载并处理数据
        run: |
          # 1. 下载你的 10GB+ 大包
          curl -L "https://3004.filemail.com/api/file/get?compressedfilekey=mFzHcD7uQxqiELj5hREADDk799vJ1AYPfpDs-uWemg" -o workspace.zip
          
          # 2. 解压外层 ZIP
          unzip workspace.zip
          
          # 3. 解压你的两个核心 tar.gz (请确保文件名正确，如果不确定可以先 ls 查看)
          # 假设文件名是 Kernel.tar.gz 和 toolchain.tar.gz
          tar -xzvf Kernel.tar.gz
          tar -xzvf toolchain.tar.gz
          
          # 4. 删除多余的压缩包节省空间
          rm workspace.zip *.tar.gz

      - name: 强力提交至仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加所有解压后的文件
          git add .
          
          # 提交并推送
          # 注意：因为数据量巨大，GitHub 可能需要一点时间处理
          git commit -m "chore: cloud sync source and tools"
          git push origin main
