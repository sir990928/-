name: Build Kernel

关于：:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt update && sudo apt install -y bc bison flex gcc-aarch64-linux-gnu libssl-dev make zip python3

      - name: Download your zip package
        run: wget -O files.zip "https://3004.filemail.com/api/file/get?compressedfilekey=mFzHcD7uQxqiELj5hREADDk799vJ1AYPfpDs-uWemg"

      - name: Unzip all
        run: unzip files.zip -d .

      - name: Extract kernel
        run: mkdir kernel && tar -xf *.tar.gz -C kernel --strip-components=1 2>/dev/null || true

      - name: Extract toolchain
        run: mkdir toolchain && ls | grep toolchain | xargs -I {} tar -xf {} -C toolchain --strip-components=1 2>/dev/null || true

      - name: Add toolchain to PATH
        run: echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Build kernel with GKI script
        run: |
          cd kernel
          chmod +x build_kernel_GKI.sh
          ./build_kernel_GKI.sh pa3q_chn_openx user sun

      - name: Make flashable zip
        run: |
          cd kernel
          # 兼容GKI脚本的out目录和原生boot目录
          zip kernel.zip out/arch/arm64/boot/Image* out/arch/arm64/boot/dtbo.img 2>/dev/null || zip kernel.zip arch/arm64/boot/Image* arch/arm64/boot/dtbo.img 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable
          path: kernel/kernel.zip
