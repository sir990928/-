名称: 构建内核

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt update && sudo apt install -y bc bison flex gcc-aarch64-linux-gnu libssl-dev make zip

      - name: Download your zip package
        run: wget -O files.zip "https://3004.filemail.com/api/file/get?compressedfilekey=mFzHcD7uQxqiELj5hREADDk799vJ1AYPfpDs-uWemg"

      - name: Unzip all
        run: unzip files.zip -d .

      - name: Extract kernel
        run: mkdir kernel && tar -xf *.tar.gz -C kernel --strip-components=1 2>/dev/null || true

      - name: Extract toolchain
        run: mkdir toolchain && ls | grep toolchain | xargs -I {} tar -xf {} -C toolchain --strip-components=1 2>/dev/null || true

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Make flashable zip
        run: |
          cd kernel
          zip kernel.zip arch/arm64/boot/Image* arch/arm64/boot/dtbo.img

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-flashable
          path: kernel/kernel.zip
