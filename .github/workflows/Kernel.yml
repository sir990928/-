name: "S25U-Structured"

on:
  workflow_dispatch:
    inputs:
      su:
        description: "选择SU类型"
        required: true
        default: "KernelSU"
        type: choice
        options:
          - KernelSU
          - SukiSU-Ultra
          - KernelSU-Next
          - ReSukiSU

jobs:
  # --- 文件夹 1: 环境准备与注入 (Prepare_and_Patch) ---
  Prepare_and_Patch:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 检出代码
        uses: actions/checkout@v4
        with:
          repository: sir990928/S25u
          token: ${{ secrets.Yml }}
          fetch-depth: 1

      - name: 🔁 覆盖配置
        run: |
          git fetch origin config-deploy --depth 1 --no-tags
          git checkout --force origin/config-deploy -- .

      - name: 🧩 执行合并与注入逻辑
        run: echo "此处运行 merge-files, setup-Root, setup-susfs"
        # 注意：为了让下一个 Job 能编，你可能需要在这里 upload 整个源码（极其耗时）
        # 或者将 Prepare 和 Build 合并在一个 Job 里，只把 Pack 拆出去。

  # --- 文件夹 2: 核心编译 (Kernel_Build) ---
  Kernel_Build:
    needs: Prepare_and_Patch
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ 运行编译脚本
        run: |
          ./kernel_platform/build/kernel/build.config.sh &
          sleep 2
          yes "" | ./build_kernel_GKI.sh pa3q_chn_openx user sun

  # --- 文件夹 3: 打包与上传 (Final_Packaging) ---
  Final_Packaging:
    needs: Kernel_Build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📦 AnyKernel3 打包
        run: echo "执行 zip 打包逻辑"

      - name: 📤 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: S25U-Kernel
          path: final_artifacts/

