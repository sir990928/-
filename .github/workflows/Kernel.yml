name: "SM-S9380"

on:
  workflow_dispatch:
    inputs:
      su:
        description: "选择SU类型"
        required: true
        default: "KernelSU"
        type: choice
        options:
          - None
          - KernelSU
          - SukiSU-Ultra
          - KernelSU-Next
          - ReSukiSU

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 仅拉最新单提交，极速检出
        uses: actions/checkout@v4
        with:
          repository: sir990928/S25u
          token: ${{ secrets.Yml }}
          fetch-depth: 1
          submodules: false
          fetch-tags: false

      - name: 🔁 极速拉取 config-deploy 最新覆盖
        run: |
          git fetch origin config-deploy --depth 1 --no-tags
          git checkout --force origin/config-deploy -- .

      - name: 一键清理所有残留模块引用
        shell: bash
        run: |
          find . -name "prepare_vendor.sh" -exec sed -i '/cp.*zsmalloc\.ko\|cp.*zram\.ko/s/^/#/' {} \;
          find . -name "BUILD.bazel" -exec sed -i '/zram\.ko\|zsmalloc\.ko\|ssg\.ko/d' {} \;
          echo "✅ 已清理 prepare_vendor.sh 和所有 BUILD.bazel 中的 zram/zsmalloc/ssg"
         
      - name: 碎片合成与授权
        uses: ./.github/actions/merge-files

      - name: 版本号注入
        uses: ./.github/actions/version-patch
        with:
          su: "${{ github.event.inputs.su }}"

      - name: 🧩 注入 SU
        uses: ./.github/actions/setup-Root
        with:
          su: ${{ github.event.inputs.su }}

      - name: 🧩 自动配置并注入 SUSFS
        uses: ./.github/actions/setup-susfs
        with:
          apply_ksu_patch: ${{ github.event.inputs.su != 'None' }}
          su: ${{ github.event.inputs.su }}

      - name: 编译打包上传全套
        uses: ./.github/actions/build-finish
        with:
          su-type: ${{ github.event.inputs.su }}
