name: "SM-S9380"

on:
  workflow_dispatch:
    inputs:
      su:
        description: "选择SU类型"
        required: true
        default: "KernelSU"
        type: choice
        options:
          - None
          - KernelSU
          - SukiSU-Ultra
          - KernelSU-Next
          - ReSukiSU

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 仅拉最新单提交，极速检出
        uses: actions/checkout@v4
        with:
          repository: sir990928/S25u
          token: ${{ secrets.Yml }}
          fetch-depth: 1
          submodules: false
          fetch-tags: false

      - name: 🔁 极速拉取 config-deploy 最新覆盖
        run: |
          git fetch origin config-deploy --depth 1 --no-tags
          git checkout --force origin/config-deploy -- .

      - name: 精准清理
        shell: bash
        run: |
          # 1. 删除 prepare_vendor.sh 里的强制复制行
          FILE="kernel_platform/build/kernel/android/prepare_vendor.sh"
          if [ -f "$FILE" ]; then
            grep -v "cp.*zsmalloc\.ko\|cp.*zram\.ko" "$FILE" > /tmp/prepare_vendor_clean.sh
            mv /tmp/prepare_vendor_clean.sh "$FILE"
            chmod +x "$FILE"
            echo "✅ 已删除 $FILE 中的 zram/zsmalloc 强制复制"
          else
            echo "⚠️ $FILE 未找到，跳过"
          fi

          # 2. 删除两个 modules.bzl 里包含 zram/zsmalloc/ssg 的行
          for F in kernel_platform/common/modules.bzl kernel_platform/msm-kernel/modules.bzl; do
            if [ -f "$F" ]; then
              grep -v 'zram.ko\|zsmalloc.ko\|ssg.ko' "$F" > /tmp/clean_bzl
              mv /tmp/clean_bzl "$F"
              echo "✅ 已清理 $F"
            else
              echo "⚠️ $F 未找到，跳过"
            fi
          done

          echo "✅ 精准清理完成"
         
      - name: 碎片合成与授权
        uses: ./.github/actions/merge-files

      - name: 版本号注入
        uses: ./.github/actions/version-patch
        with:
          su: "${{ github.event.inputs.su }}"

      - name: 🧩 注入 SU
        uses: ./.github/actions/setup-Root
        with:
          su: ${{ github.event.inputs.su }}

      - name: 🧩 自动配置并注入 SUSFS
        uses: ./.github/actions/setup-susfs
        with:
          apply_ksu_patch: ${{ github.event.inputs.su != 'None' }}
          su: ${{ github.event.inputs.su }}

      - name: 编译打包上传全套
        uses: ./.github/actions/build-finish
        with:
          su-type: ${{ github.event.inputs.su }}
