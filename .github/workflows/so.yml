name: Build CVE Payload AYA1
on:
  push:
    branches: [ main ]
    paths:
      - "Root-My-Galaxy-Payloads-main/**"
      - ".github/workflows/build-payload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.Yml }}
          persist-credentials: false

      - name: 打印目录结构【调试】
        run: |
          pwd
          ls -la

      - name: 安装依赖工具
        run: |
          sudo apt update
          sudo apt install -y make wget unzip

      - name: 下载并解压NDK r27
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip android-ndk-r27-linux.zip
          echo "$PWD/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 进入Payload项目编译漏洞程序
        run: |
          cd Root-My-Galaxy-Payloads-main
          make clean
          rm -rf build/
          make TARGET=pa3q-S9380ZHU1AYA1 TARGET_CC=aarch64-linux-android35-clang release

      - name: 复制编译产物并重命名（增加哈希校验）
        run: |
          cd Root-My-Galaxy-Payloads-main
          SRC_SO="build/pa3q-S9380ZHU1AYA1/cve-2026-43499-app.release.so"
          echo "【编译产物哈希】"
          sha256sum ${SRC_SO}
          DST_FOLDER="artifacts/pa3q-S9380ZHU1AYA1"
          mkdir -p ${DST_FOLDER}
          cp -v ${SRC_SO} ${DST_FOLDER}/cve-2026-43499-app.so
          echo "【输出目录文件哈希】"
          sha256sum ${DST_FOLDER}/cve-2026-43499-app.so
          ls -la ${DST_FOLDER}/

      - name: Git提交推送更新文件
        run: |
          cd Root-My-Galaxy-Payloads-main
          git config --global user.name "CI Builder"
          git config --global user.email "ci@localhost"
          git remote set-url origin https://${{ secrets.Yml }}@github.com/${{ github.repository }}.git
          git add artifacts/pa3q-S9380ZHU1AYA1/
          if git commit -m "CI: auto build pa3q-S9380ZHU1AYA1 exploit payload [skip ci]";then
            git push origin HEAD:main
            echo "✅ 编译完成，文件已推送仓库"
          else
            echo "ℹ️ 文件无变更，跳过提交"
          fi

