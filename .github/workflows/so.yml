name: Build CVE Payload AYA1
on:
  push:
    branches: [ main ]
    paths:
      - "Root-My-Galaxy-Payloads-main/**"
      - ".github/workflows/build-payload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.Yml }}
          persist-credentials: false

      - name: 安装依赖工具
        run: |
          sudo apt update
          sudo apt install -y make wget unzip

      - name: 下载并解压 NDK r27
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27" >> $GITHUB_ENV

      - name: 编译漏洞程序
        run: |
          cd Root-My-Galaxy-Payloads-main
          rm -rf build/
          make TARGET=pa3q-S9380ZHU1AYA1 API=35 all

      - name: 复制并校验产物 (so)
        run: |
          cd Root-My-Galaxy-Payloads-main
          SRC_SO="build/pa3q-S9380ZHU1AYA1/cve-2026-43499-app.so"
          echo "【so 哈希】"
          sha256sum ${SRC_SO}
          DST_FOLDER="artifacts/pa3q-S9380ZHU1AYA1"
          mkdir -p ${DST_FOLDER}
          cp -v ${SRC_SO} ${DST_FOLDER}/cve-2026-43499-app.so

      - name: 复制 root-umh 到 artifacts
        run: |
          cd Root-My-Galaxy-Payloads-main
          SRC_UMH="build/pa3q-S9380ZHU1AYA1/cve-2026-43499"
          ls -la ${SRC_UMH}
          DST_FOLDER="artifacts/pa3q-S9380ZHU1AYA1"
          cp -v ${SRC_UMH} ${DST_FOLDER}/cve-2026-43499
          echo "【root-umh 哈希】"
          sha256sum ${DST_FOLDER}/cve-2026-43499

      - name: 复制 root 守护进程到 APK jniLibs
        run: |
          ROOT_BIN="$GITHUB_WORKSPACE/Root-My-Galaxy-Payloads-main/build/pa3q-S9380ZHU1AYA1/cve-2026-43499-root"
          ls -la ${ROOT_BIN}
          DST_DIR="$GITHUB_WORKSPACE/Root-My-Galaxy-main/app/src/main/jniLibs/arm64-v8a"
          mkdir -p ${DST_DIR}
          cp -v ${ROOT_BIN} ${DST_DIR}/libcve43499root.so
          echo "【root so 哈希】"
          sha256sum ${DST_DIR}/libcve43499root.so

      - name: 提交推送产物
        run: |
          git config user.name "CI Builder"
          git config user.email "ci@localhost"
          git remote set-url origin https://${{ secrets.Yml }}@github.com/${{ github.repository }}.git
          git add Root-My-Galaxy-Payloads-main/artifacts/pa3q-S9380ZHU1AYA1/
          git add Root-My-Galaxy-main/app/src/main/jniLibs/arm64-v8a/libcve43499root.so
          if git diff --cached --quiet; then
            echo "ℹ️ 文件无变更，跳过提交"
          else
            git commit -m "CI: auto build pa3q-S9380ZHU1AYA1 [skip ci]"
            git push origin HEAD:main
            echo "✅ 编译完成，文件已推送仓库"
          fi