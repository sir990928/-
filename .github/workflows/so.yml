name: Build CVE Payload AYA1
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.Yml }}

      - name: Install basic tools
        run: |
          sudo apt update
          sudo apt install -y make wget unzip

      - name: Download Android NDK 27 (Android 15 API35)
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip android-ndk-r27-linux.zip
          echo "$PWD/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Enter makelife directory & compile
        run: |
          cd makelife
          make clean
          # 指定交叉编译clang
          make TARGET=pa3q-S9380ZHU1AYA1 TARGET_CC=aarch64-linux-android35-clang release

      - name: Copy compiled so to artifacts folder
        run: |
          SRC_SO="makelife/build/pa3q-S9380ZHU1AYA1/cve-2026-43499-app.release.so"
          DST_FOLDER="artifacts/pa3q-S9380ZHU1AYA1"
          DST_SO="${DST_FOLDER}/cve-2026-43499-app.so"
          
          mkdir -p ${DST_FOLDER}
          cp -v ${SRC_SO} ${DST_SO}

      - name: Commit & push updated payload
        run: |
          git config --global user.name "CI Builder"
          git config --global user.email "ci@localhost"
          git add artifacts/pa3q-S9380ZHU1AYA1/cve-2026-43499-app.so
          git commit -m "CI: auto build update pa3q-S9380ZHU1AYA1 cve payload" || echo "No file changes, skip commit"
          git push

