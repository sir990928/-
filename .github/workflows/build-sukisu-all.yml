name: Build SuKiSU ko + ksud

on:
  push:
    paths:
      - 'SukiSU-Ultra/**'
  workflow_dispatch:

jobs:
  build-ko:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
      options: --privileged

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build kernelsu.ko
      run: |
        cd SukiSU-Ultra/kernel
        CONFIG_KSU=m \
        CONFIG_KSU_SAMSUNG_DEFEX=y \
        CONFIG_KSU_SAMSUNG_KDP=y \
        CONFIG_KSU_SAMSUNG_RKP=y \
        CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
        CC=clang make
        
        mkdir -p /github/workspace/out
        cp kernelsu.ko /github/workspace/out/android15-6.6_kernelsu-sukisu.ko

    - name: Upload ko
      uses: actions/upload-artifact@v4
      with:
        name: android15-6.6-lkm
        path: /github/workspace/out/android15-6.6_kernelsu-sukisu.ko

  build-ksud:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 下载并安装 NDK r29
      run: |
        set -eu
        wget -q --timeout=60 --tries=5 \
          "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" \
          -O /tmp/android-ndk.zip
        unzip -q /tmp/android-ndk.zip -d /tmp/
        mkdir -p "$(dirname ${ANDROID_NDK_HOME})"
        mv /tmp/android-ndk-r29 "${ANDROID_NDK_HOME}"
        rm /tmp/android-ndk.zip

    - name: Setup rustup
      run: |
        rustup update stable
        rustup target add aarch64-linux-android

    - name: Build ksud
      run: |
        source SukiSU-Ultra/.github/scripts/setup-rust-build.sh aarch64-linux-android 26
        RUSTFLAGS="-C opt-level=z -C lto" cargo build --target aarch64-linux-android --release --manifest-path ./SukiSU-Ultra/userspace/ksud/Cargo.toml
        STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
        "$STRIP" SukiSU-Ultra/target/aarch64-linux-android/release/ksud

    - name: Upload ksud
      uses: actions/upload-artifact@v4
      with:
        name: ksud-samsung
        path: SukiSU-Ultra/target/aarch64-linux-android/release/ksud
