name: Build SuKiSU ko + ksud

on:
  push:
    paths:
      - 'SukiSU-Ultra/**'
  workflow_dispatch:

jobs:
  build-ko:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260313
      options: --privileged

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build kernelsu.ko
      run: |
        cd SukiSU-Ultra/kernel
        CONFIG_KSU=m \
        CONFIG_KSU_SAMSUNG_DEFEX=y \
        CONFIG_KSU_SAMSUNG_KDP=y \
        CONFIG_KSU_SAMSUNG_RKP=y \
        CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
        CC=clang make
        
        mkdir -p /github/workspace/out
        cp kernelsu.ko /github/workspace/out/android15-6.6_kernelsu-sukisu.ko

    - name: Upload ko
      uses: actions/upload-artifact@v4
      with:
        name: android15-6.6-lkm
        path: /github/workspace/out/android15-6.6_kernelsu-sukisu.ko

  build-ksud:
    needs: build-ko
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download ko
      uses: actions/download-artifact@v4
      with:
        name: android15-6.6-lkm
        path: SukiSU-Ultra/userspace/ksud/bin/aarch64/

    - name: Setup rustup
      run: |
        rustup update stable
        rustup target add aarch64-linux-android

    - uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r29

    - name: Build ksud
      env:
        CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
        AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
      run: |
        cargo build --target aarch64-linux-android --release --manifest-path ./SukiSU-Ultra/userspace/ksud/Cargo.toml

    - name: Upload ksud
      uses: actions/upload-artifact@v4
      with:
        name: ksud-samsung
        path: target/aarch64-linux-android/release/ksud
