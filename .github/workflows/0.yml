name: Build KernelSU Next ksud Only

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "KernelSU Next repository"
        required: true
        default: "KernelSU-Next/KernelSU-Next"
        type: string
      source_ref:
        description: "KernelSU Next tag or branch"
        required: true
        default: "v3.3.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout KernelSU Next
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "ndk;27.2.12479018"

      - name: Build ksud only
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export NDK_SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          export PATH="$NDK_BIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android35-clang"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="\
            --sysroot=$NDK_SYSROOT \
            -I$NDK_SYSROOT/usr/include/aarch64-linux-android \
            -I$NDK_SYSROOT/usr/include"

          cargo clean --manifest-path userspace/ksud/Cargo.toml
          cargo build --release \
            --target aarch64-linux-android \
            --manifest-path userspace/ksud/Cargo.toml

      - name: Verify and package ksud
        run: |
          mkdir -p dist
          cp userspace/ksud/target/aarch64-linux-android/release/ksud \
            dist/ksud-aarch64-linux-android
          sha256sum dist/ksud-aarch64-linux-android \
            | tee dist/SHA256SUMS
          file dist/ksud-aarch64-linux-android
          llvm-readelf -h dist/ksud-aarch64-linux-android

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksud-only-aarch64-linux-android
          path: dist
          if-no-files-found: error
