name: Build SuKiSU Manager APK

on:
  push:
    paths:
      - 'SukiSU-Ultra/manager/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Link uapi headers
      run: |
        ln -sf "$(pwd)/SukiSU-Ultra/uapi" SukiSU-Ultra/manager/app/src/main/cpp/uapi

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: temurin

    - uses: android-actions/setup-android@v3

    - name: Build APK
      working-directory: SukiSU-Ultra/manager
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sukisu-manager
        path: SukiSU-Ultra/manager/app/build/outputs/apk/release/*.apk
